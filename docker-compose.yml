# Optional local PostgreSQL with pgvector (alternative to Neon for offline development).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
      POSTGRES_DB: slotly
    ports:
      - "5433:5432"
    volumes:
      - slotly-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  slotly-pg:
